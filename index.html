<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor Rápido</title>
</head>
<body>
  <header>
    <h1>Conversor Rápido</h1>
  </header>

  <main>
    <section id="conversor">
      <h2>Converter</h2>
      <form id="form-conversao">
        <label for="valor">Valor</label>
        <input type="text" id="valor" name="valor" inputmode="decimal" autocomplete="off">

        <label for="tipo">Conversão</label>
        <select id="tipo" name="tipo">
          <option value="c-f">Celsius → Fahrenheit</option>
        </select>

        <button type="submit">Converter</button>
      </form>

      <p id="resultado"></p>
    </section>
  </main>

  <footer>
    <p>Desenvolvimento de Sistemas Web — UFMA</p>
  </footer>
</body>
</html>
