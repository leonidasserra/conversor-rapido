<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Conversor Rápido</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Conversor Rápido</h1>
  </header>

  <main>
    <section id="conversor">
      <h2>Converter</h2>
      <form id="form-conversao">
        <label for="valor">Valor</label>
        <input type="text" id="valor" name="valor" inputmode="decimal" autocomplete="off">

        <label for="tipo">Conversão</label>
        <select id="tipo" name="tipo">
          <option value="c-f">Celsius → Fahrenheit</option>
          <option value="f-c">Fahrenheit → Celsius</option>
          <option value="km-mi">Quilômetros → Milhas</option>
          <option value="mi-km">Milhas → Quilômetros</option>
          <option value="kg-lb">Quilogramas → Libras</option>
          <option value="lb-kg">Libras → Quilogramas</option>
        </select>

        <button type="submit">Converter</button>
      </form>

      <p id="resultado" aria-live="polite"></p>
    </section>

    <section id="historico">
      <h2>Últimas conversões</h2>
      <ul id="lista-historico"></ul>
      <button type="button" id="limpar-historico">Limpar histórico</button>
    </section>
  </main>

  <footer>
    <p>Desenvolvimento de Sistemas Web — UFMA</p>
  </footer>
</body>
</html>
